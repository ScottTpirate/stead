schema_version: "0.1"
combining_rule: "allow = authorization.relationship.allowed AND OPA policy allow AND authorization.provider_path.allowed AND no explicit deny; agents additionally require every authorization.agent_intersection term"
default: deny
cases:
  - {id: OPA-001, condition: authorization_relationship_allowed_is_false, expect: deny, reason: relationship_denied}
  - {id: OPA-001A, condition: provider_path_allowed_is_false, expect: deny, reason: provider_enforcement_denied}
  - {id: OPA-001B, condition: consistency_fence_is_older_than_resource_label_tuple_or_revocation_revision, expect: deny, reason: stale_authorization_input}
  - {id: OPA-002, condition: explicit_deny_present, expect: deny, reason: explicit_policy_deny}
  - {id: OPA-003, condition: resource_sensitivity_exceeds_session_or_deployment_ceiling, expect: deny, reason: ceiling_exceeded}
  - {id: OPA-004, condition: required_compartment_missing, expect: deny, reason: compartment_missing}
  - {id: OPA-005, condition: trusted_attribute_expired_unverified_or_wrong_authority, expect: deny, reason: trusted_attribute_invalid}
  - {id: OPA-006, condition: resource_capability_inactive, expect: deny, reason: capability_inactive}
  - {id: OPA-007, condition: dissemination_or_releasability_constraint_not_satisfied, expect: deny, reason: dissemination_denied}
  - {id: OPA-008, condition: cui_category_or_subcategory_handling_not_satisfied, expect: deny, reason: cui_handling_denied}
  - {id: OPA-009, condition: citizenship_or_organization_affiliation_not_authorized, expect: deny, reason: affiliation_denied}
  - {id: OPA-010, condition: authentication_device_network_or_time_constraint_not_satisfied, expect: deny, reason: context_denied}
  - {id: OPA-011, condition: export_share_or_external_channel_not_authorized, expect: deny, reason: export_or_share_denied}
  - {id: OPA-011A, condition: data_flow_context_required_but_missing_or_destination_unverifiable, expect: deny, reason: data_flow_context_invalid}
  - {id: OPA-012, condition: lowering_downgrade_or_decontrol_lacks_authority_reason_source_or_required_second_approver, expect: deny, reason: lowering_denied}
  - {id: OPA-013, condition: ci_runner_domain_image_network_or_secret_constraint_not_satisfied, expect: deny, reason: ci_policy_denied}
  - {id: OPA-013A, condition: ci_context_required_but_missing_or_unverifiable, expect: deny, reason: ci_context_invalid}
  - {id: OPA-014, condition: infrastructure_admission_backup_storage_or_integration_constraint_not_satisfied, expect: deny, reason: infrastructure_policy_denied}
  - {id: OPA-014A, condition: infrastructure_context_required_but_missing_or_unverifiable, expect: deny, reason: infrastructure_context_invalid}
  - {id: OPA-015, condition: non_agent_all_checks_allow, expect: allow, obligations: [display_marking, audit_access]}
  - {id: OPA-AGENT-001, condition: agent_context_missing, expect: deny, reason: agent_context_missing}
  - {id: OPA-AGENT-002, condition: delegation_missing_expired_or_revoked, expect: deny, reason: delegation_invalid}
  - {id: OPA-AGENT-003, condition: agent_authority_missing_or_revoked, expect: deny, reason: agent_authority_invalid}
  - {id: OPA-AGENT-004, condition: task_scope_excludes_action_or_resource, expect: deny, reason: task_scope_denied}
  - {id: OPA-AGENT-005, condition: runtime_domain_or_environment_not_authorized, expect: deny, reason: runtime_denied}
  - {id: OPA-AGENT-006, condition: agent_ceiling_or_compartments_insufficient, expect: deny, reason: agent_classification_denied}
  - {id: OPA-AGENT-007, condition: every_agent_intersection_term_true_and_all_common_checks_allow, expect: allow, obligations: [display_marking, audit_access]}
  - {id: OPA-AGENT-008, condition: agent_runtime_attestation_missing_expired_unverified_or_wrong_authority, expect: deny, reason: runtime_attestation_invalid}
  - {id: OPA-HIERARCHY-001, condition: only_team_parent_relationship_exists, expect: deny, reason: no_explicit_authorization}
  - {id: OPA-LEAK-001, condition: resource_unauthorized_and_operation_is_count_facet_suggestion_activity_notification_graph_or_error, expect: deny_and_suppress, reason: existence_protected}
coverage_rules:
  decision_rows: 100_percent
  critical_policy_mutation_score: at_least_90_percent
  missing_input: deny
  unknown_profile_or_bundle: deny
  stale_consistency_fence: deny
