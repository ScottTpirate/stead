schema_version: "0.1"
combining_rule: "allow = authorization.relationship.allowed AND policy decision allow AND authorization.provider_path.allowed AND no explicit deny; agents additionally require every authorization.agent_intersection term"
default: deny
cases:
  - {id: POLICY-001, condition: authorization_relationship_allowed_is_false, expect: deny, reason: relationship_denied}
  - {id: POLICY-001A, condition: provider_path_allowed_is_false, expect: deny, reason: provider_enforcement_denied}
  - {id: POLICY-001B, condition: consistency_fence_is_older_than_resource_label_tuple_or_revocation_revision, expect: deny, reason: stale_authorization_input}
  - {id: POLICY-002, condition: explicit_deny_present, expect: deny, reason: explicit_policy_deny}
  - {id: POLICY-003, condition: resource_sensitivity_exceeds_session_or_deployment_ceiling, expect: deny, reason: ceiling_exceeded}
  - {id: POLICY-004, condition: required_compartment_missing, expect: deny, reason: compartment_missing}
  - {id: POLICY-005, condition: trusted_attribute_expired_unverified_or_wrong_authority, expect: deny, reason: trusted_attribute_invalid}
  - {id: POLICY-006, condition: resource_capability_inactive, expect: deny, reason: capability_inactive}
  - {id: POLICY-007, condition: dissemination_or_releasability_constraint_not_satisfied, expect: deny, reason: dissemination_denied}
  - {id: POLICY-008, condition: active_profile_category_handling_semantics_not_satisfied, expect: deny, reason: profile_handling_denied}
  - {id: POLICY-009, condition: citizenship_or_organization_affiliation_not_authorized, expect: deny, reason: affiliation_denied}
  - {id: POLICY-010, condition: authentication_device_network_or_time_constraint_not_satisfied, expect: deny, reason: context_denied}
  - {id: POLICY-011, condition: export_share_or_external_channel_not_authorized, expect: deny, reason: export_or_share_denied}
  - {id: POLICY-011A, condition: data_flow_context_required_but_missing_or_destination_unverifiable, expect: deny, reason: data_flow_context_invalid}
  - {id: POLICY-012, condition: lowering_downgrade_or_decontrol_lacks_authority_reason_source_or_effective_approval_requirement, expect: deny, reason: lowering_denied}
  - {id: POLICY-012A, condition: lowering_approval_count_below_effective_profile_and_deployment_threshold, expect: deny, reason: lowering_approval_threshold_unsatisfied}
  - {id: POLICY-012B, condition: lowering_approval_separation_distinctness_human_or_custody_requirement_unsatisfied, expect: deny, reason: lowering_approval_separation_unsatisfied}
  - {id: POLICY-013, condition: ci_runner_domain_image_network_or_secret_constraint_not_satisfied, expect: deny, reason: ci_policy_denied}
  - {id: POLICY-013A, condition: ci_context_required_but_missing_or_unverifiable, expect: deny, reason: ci_context_invalid}
  - {id: POLICY-014, condition: infrastructure_admission_backup_storage_or_integration_constraint_not_satisfied, expect: deny, reason: infrastructure_policy_denied}
  - {id: POLICY-014A, condition: infrastructure_context_required_but_missing_or_unverifiable, expect: deny, reason: infrastructure_context_invalid}
  - {id: POLICY-015, condition: non_agent_all_checks_allow, expect: allow, obligations: [display_marking, audit_access]}
  - {id: POLICY-AGENT-001, condition: agent_context_missing, expect: deny, reason: agent_context_missing}
  - {id: POLICY-AGENT-002, condition: delegation_missing_expired_or_revoked, expect: deny, reason: delegation_invalid}
  - {id: POLICY-AGENT-003, condition: agent_authority_missing_or_revoked, expect: deny, reason: agent_authority_invalid}
  - {id: POLICY-AGENT-004, condition: task_scope_excludes_action_or_resource, expect: deny, reason: task_scope_denied}
  - {id: POLICY-AGENT-005, condition: runtime_domain_or_environment_not_authorized, expect: deny, reason: runtime_denied}
  - {id: POLICY-AGENT-006, condition: agent_ceiling_or_compartments_insufficient, expect: deny, reason: agent_classification_denied}
  - {id: POLICY-AGENT-007, condition: every_agent_intersection_term_true_and_all_common_checks_allow, expect: allow, obligations: [display_marking, audit_access]}
  - {id: POLICY-AGENT-008, condition: agent_runtime_attestation_missing_expired_unverified_or_wrong_authority, expect: deny, reason: runtime_attestation_invalid}
  - {id: POLICY-HIERARCHY-001, condition: only_team_parent_relationship_exists, expect: deny, reason: no_explicit_authorization}
  - {id: POLICY-LEAK-001, condition: resource_unauthorized_and_operation_is_count_facet_suggestion_activity_notification_graph_or_error, expect: deny_and_suppress, reason: existence_protected}
coverage_rules:
  decision_rows: 100_percent
  critical_policy_mutation_score: at_least_90_percent
  deterministic_replay: identical_input_and_policy_bundle_revision_produces_semantically_identical_output_excluding_decision_id
  differential_conformance: required_when_multiple_evaluators_are_supported
  missing_input: deny
  unknown_profile_or_bundle: deny
  stale_consistency_fence: deny
  evaluator_timeout_or_unavailable: deny
  malformed_result_or_unsupported_obligation: deny
  approval_thresholds: effective_profile_and_deployment_policy_supports_1_2_3_or_higher
