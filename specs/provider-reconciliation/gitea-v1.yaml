schema_version: "1.0"
status: governed_by_adr_0009
owner: WS-03
decision_record: docs/adr/0009-gitea-provider-reconciliation-precedence-and-conflict-handling.md
activation_gate: ADR-CAND-008_ACCEPTED_AT_EXACT_IMMUTABLE_SHA
requirements:
  - PRIN-002
  - ARCH-004
  - DOM-004
  - SCM-001
  - SCM-002
  - SCM-003
  - SCM-004
  - SCM-005
  - AUTH-002
  - AUTH-006
  - CLS-003
  - CLS-006
  - CLS-007
  - SEC-006
  - EVT-003
  - AUD-001
  - AUD-002
  - TEST-006
  - PERF-003
  - PERF-004

authority:
  canonical_state: module_owned_postgresql
  provider_owned_state: gitea_documented_api_or_git
  provider_permission: enforcement_not_authority
  webhook: dirty_notification_not_canonical_delta
  ordinary_ui_read_source: local_rebuildable_postgresql_projection
  ordinary_ui_synchronous_provider_calls: 0

field_classes:
  canonical_only:
    examples: [organization_id, team_id, project_id, work_item_id, capabilities, team_hierarchy, typed_domain_relationships, agent_assignment, effective_label]
    disagreement: quarantine_attempted_representation_or_remap
  provider_content:
    examples: [work_title, work_body, comments, reactions, repository, branch, commit, pull_request]
    disagreement: accept_one_proven_authorized_delta_else_reset_or_quarantine
  mapped_value:
    examples: [work_type, priority, status, cycle_milestone, active_user_assignee]
    disagreement: accept_exact_existing_mapping_else_reset_or_quarantine
  managed_configuration:
    examples: [hidden_tracker, fixed_board, managed_labels, repository_purpose, webhook_registration]
    disagreement: reset_and_verify_else_quarantine
  central_security:
    examples: [authorization_relationship_tuples, permissions, security_domain, classification, handling, provider_path_eligibility]
    disagreement: fence_reset_verify_or_remain_denied_and_quarantined
  provider_identity:
    examples: [installation_id, repository_id, issue_id, comment_id, issue_number, git_sha, provider_creation_time]
    disagreement: map_only_to_authorized_resource_else_quarantine
  derived_projection:
    examples: [normalized_snapshot, search_input, activity_input, inbox_input, reconciliation_health]
    disagreement: rebuild_or_suppress_never_settle_authority

authorization_scope:
  type: ProviderAuthorizationScope
  owner: WS-06
  consumer: WS-03
  purpose: one_bounded_logical_internal_reconciliation_read_operation
  reusable: false
  renewable: false
  transferable: false
  eligible_calls:
    - pagination_read
    - snapshot_read
    - bounded_verification_read
    - compatibility_profile_safe_idempotent_read_retry
  excluded_effects_requiring_own_durable_one_use_permit:
    - provider_mutation
    - credential_issuance
    - direct_git_or_protocol_access
    - export_or_download
    - non_idempotent_call
    - ambiguous_external_effect
    - operation_outliving_logical_request_or_job
  required_bindings:
    - scope_id
    - logical_operation_id
    - acting_service_principal
    - initiating_principal_or_explicit_system_initiator
    - organization_id
    - security_domain_id
    - canonical_container
    - closed_resource_set_or_container_inventory_scope
    - provider_installation_id
    - provider_api_path
    - provider_resource_key_when_resource_specific
    - reconciliation_generation
    - allowed_operation_class
    - closed_call_plan
    - activation_snapshot
    - authorization_consistency_vector
    - compatibility_profile_id_version_and_schema_digest
    - original_deadline
    - immutable_earliest_bound_expiry
    - execution_claim_id
    - execution_holder_instance_id
    - execution_fencing_token
    - execution_claim_deadline
  call_plan_fixed_before_first_provider_call:
    - http_method_and_path_templates
    - resource_set_or_container_inventory_scope
    - cursor_derivation_rules
    - call_order
    - retry_classes
    - maximum_attempts
    - maximum_calls
    - maximum_pages
    - maximum_items
    - maximum_response_bytes
  execution_claim:
    owner: WS-03
    activation: atomic_issued_to_active_once_before_first_provider_call
    bound_fields: [execution_claim_id, execution_holder_instance_id, execution_fencing_token, execution_claim_deadline]
    holder_identity_source: process_start_bound_replica_boot_pid_start_and_random_nonce
    allowed_states: [issued, active, completed, abandoned, expired]
    dispatch_requires: active_exact_process_instance_holder_and_monotonic_fencing_token_before_claim_deadline
    same_holder_concurrency: process_local_single_flight_guard_on_non_shareable_instance_binding_required_before_validation
    fork_or_clone_behavior: inherited_binding_invalid_when_current_process_identity_differs_and_child_must_rekey_with_new_scope
    concurrent_or_forked_claim: denied_before_provider_io
    handoff_or_resume: prohibited
    same_scope_takeover: prohibited_new_scope_required
    terminal_transition: permanent_compare_and_swap_to_completed_abandoned_or_expired
    stale_holder_after_fence_or_terminal_transition: denied_before_provider_io
    per_eligible_call_or_page_claim_writes: 0
  inventory_list_behavior:
    observed_values: opaque_provider_resource_keys_within_bound_container_and_item_budget
    authority: inventory_drift_evidence_only
    prohibited:
      - widen_authority
      - authorize_canonical_acceptance
      - add_undeclared_resource_specific_followup
    followup_rule: predeclared_deterministic_container_rule_or_fresh_decision_and_scope
  before_each_provider_call:
    mode: read_only_validation
    checks:
      - exact_scope_and_logical_operation
      - principals_organization_domain_container_and_resources
      - installation_path_resource_key_generation_and_operation_class
      - call_plan_method_path_cursor_order_and_local_counters
      - active_execution_claim_current_process_instance_holder_fencing_token_state_and_deadline
      - activation_snapshot_and_authorization_consistency_vector
      - latest_provider_enforcement_and_resource_fences
      - compatibility_profile_deadline_and_expiry
  before_local_outcome_commit:
    mode: read_only_validation_plus_owner_transaction_fence
    checks:
      - all_before_call_checks
      - final_execution_local_totals_within_whole_plan_envelope
      - active_execution_claim_current_process_instance_holder_fencing_token_state_and_deadline
      - no_newer_dirty_generation
      - canonical_owner_revision
  persistence:
    start_transaction:
      - immutable_scope_identity_and_bindings
      - conservative_whole_plan_envelope
      - atomic_one_time_execution_claim_activation
      - reserved_terminal_audit_event_intent_reference_and_preassigned_uuidv7_audit_record_id_only_not_outbox_or_audit_row
    per_eligible_read_writes: 0
    per_eligible_page_writes: 0
    accounting_during_execution: process_local_monotonic_counters
    uncertain_dispatch: consumes_local_attempt_and_allowance
    terminalization: permanent_claim_transition_and_exactly_one_validated_ws07_owned_audit_event_intent_through_ws02_core_outbox_port
    terminal_transaction:
      coordinator: WS-02_WithinTransaction
      participant_plan:
        - WS-03_scm_reconciliation_terminalize_writes_only_scm_state
        - WS-02_core_outbox_append_validated_intent_is_final_write_participant
      atomicity: claim_accounting_terminal_evidence_and_intent_commit_together_or_none
      failure_behavior: any_participant_failure_lost_commit_response_or_clean_expiry_race_is_resolved_by_cas_and_exact_intent_identity_without_partial_state
      external_calls_inside_transaction: prohibited_including_gitea_nats_openfga_and_evidence_resolution
      audit_table_write: prohibited
    terminal_intent_cardinality: exactly_one_per_scope_appended_only_by_successful_terminalization_or_expiry_recovery
    clean_completion: one_terminal_intent_with_exact_attempt_call_page_item_byte_counts
    interrupted_completion: one_terminal_intent_with_reserved_upper_bounds_and_abandoned_or_crash_result
    page_count_growth: constant_scope_claim_accounting_and_terminal_intent_control_write_count
    audit_materialization:
      owner: WS-07
      source: exact_ws07_validated_canonical_event_bytes_from_ws02_core_outbox_before_transfer_or_immutable_ws07_successor_bindings_after_transfer
      event_lookup_reference: logical_operation_id_is_the_only_protected_operation_reference_and_is_correlation_not_authority_or_provider_locator
      authorization: fresh_central_decision_for_ws07_service_principal_per_bounded_set_oriented_resolution_batch
      resolution_port_owner: WS-03
      resolution_port_mode: authenticated_authorized_typed_bounded_set_oriented_read
      resolution_request_bindings: [event_source, event_id, canonical_event_digest, organization_id, security_domain_id, canonical_container_and_resource_scope, logical_operation_id]
      resolution_response: immutable_closed_audit_v1_1_ready_projection_sufficient_for_every_owgp_audit_field_and_provider_extension
      original_authorization_revisions: historical_evidence_only_not_reused_authority
      prohibited_resolution_output: [provider_table_or_protected_backing_record, raw_provider_payload, raw_call_plan, provider_path, provider_resource_key, pagination_cursor, credential]
      write_semantics: append_only_insert_or_exact_identity_and_digest_match_never_update_or_rewriting_upsert
      stable_identity: preassigned_uuidv7_audit_record_id_plus_logical_operation_id
      mismatch: identity_digest_event_binding_or_domain_mismatch_quarantines_and_never_overwrites
      consumer_completion:
        successful: only_after_exact_audit_record_is_durable
        minimized_terminal: only_after_closed_failure_successor_obligation_and_dlq_failure_audit_intents_are_durable_in_one_transaction
        original_audit_obligation: remains_open_until_exact_audit_record_is_durable
      duplicate_replay_restart_out_of_order: exactly_one_logical_audit_record
      unavailable_or_malformed_evidence: retry_or_quarantine_fail_closed_without_successful_completion
      generic_terminal_or_dlq_substitution: prohibited_without_same_transaction_successor_obligation_transfer
      deadline_terminal_transaction:
        coordinator: WS-02_WithinTransaction
        participant_plan:
          - WS-07_audit_consumer_terminalize_and_create_successor_obligation_writes_only_ws07_state
          - WS-02_core_outbox_append_minimized_dlq_and_failure_audit_intents_is_final_write_participant
        atomicity: closed_failure_terminal_evidence_successor_obligation_and_intents_commit_together_or_none
        original_outbox_retirement: denied_until_this_transfer_commits
        external_calls_inside_transaction: prohibited_including_gitea_nats_openfga_evidence_resolution_and_other_network_io
      phase1_successor_recovery_source:
        owner: WS-07
        selection: required_real_failure_path_when_adr0008_application_deadline_closes_before_materialization
        stable_identity: preassigned_audit_record_id_plus_logical_operation_id
        immutable_contents: [preassigned_audit_record_id, event_source, event_id, canonical_event_digest, organization_id, security_domain_id, canonical_container_and_resource_scope, logical_operation_id]
        owner_written_fenced_monotonic_recovery_state: [status, fencing_token, attempt_count, next_attempt_at, last_closed_failure_code, materialized_audit_digest]
        allowed_state_progression: open_to_claimed_to_retry_wait_or_repair_required_then_exact_materialized
        prohibited_contents: [provider_binding_evidence_ref, call_plan_evidence_ref, raw_provider_payload, raw_call_plan, provider_path, provider_resource_key, pagination_cursor, credential]
        immutable_binding_creation: insert_or_exact_identity_and_digest_match_never_rewrite_immutable_fields
        lifecycle_writes: fenced_monotonic_owner_state_transitions_only
        duplicate_deadline_race: exact_match_is_idempotent_and_identity_digest_or_binding_collision_quarantines_and_prevents_original_source_retirement
        authority: recovery_obligation_only_not_authorization
        retirement: only_after_exact_original_audit_record_is_durable
        backup_restore_and_rollback: preserve_open_and_completed_obligations_with_exact_identity_and_digest
      protected_evidence_retention: immutable_digest_bound_backed_up_restored_and_resolvable_until_exact_audit_record_is_durable_then_for_its_full_audit_retention_and_reference_resolution_window
    page_independent_async_audit_writes: exactly_one_on_success_with_deadline_transfer_measured_separately_as_failure_recovery
    changed_resource_writes: measured_batched_set_oriented_and_may_scale_only_with_actual_projection_domain_unrelated_outbox_or_quarantine_changes
  process_loss:
    old_scope: permanently_abandoned_or_expired_by_fenced_compare_and_swap
    remaining_envelope: conservatively_consumed
    stale_holder_or_fork: denied_before_provider_io_by_process_instance_claim_state_fencing_token_and_deadline
    restart: only_after_old_claim_terminalization_then_fresh_central_decision_and_new_scope_from_last_trusted_job_cursor
  canonical_acceptance:
    service_read_scope_authorizes_acceptance: false
    required_before_accept:
      - fresh_effective_principal_central_decision_for_exact_delta
      - current_impersonation_constraints
      - final_activation_authorization_provider_enforcement_resource_and_operation_fences
      - optimistic_canonical_owner_precondition

snapshot_and_change_proof:
  snapshot_token_fields:
    - compatibility_profile_id
    - provider_resource_key
    - strongest_endpoint_specific_precondition_when_available
    - canonical_normalized_snapshot_sha256
    - informational_provider_timestamps
  timestamps_form_total_order: false
  direct_change_acceptance_requires:
    - supported_field_class
    - provider_authenticated_effective_actor_and_impersonator_chain
    - contiguous_predecessor_delta_result_proof
    - exactly_one_normalized_delta
    - current_effective_principal_authorization
    - final_owner_transaction_fence
  invalid_proofs:
    - webhook_sender_only
    - hmac_only
    - delivery_uuid_only
    - optional_or_partial_changes
    - token_gap
    - mixed_actor_snapshot
    - provider_local_permission

webhook:
  method: POST
  content_type: application/json
  signature:
    header: X-Gitea-Signature
    algorithm: HMAC-SHA256
    encoding: exactly_64_lowercase_hex_without_prefix
    compare: constant_time_before_json_parse
  limits:
    raw_body_bytes_max: 4194304
    json_nesting_depth_max: 32
  attempt_key:
    - installation_id
    - hook_registration_id
    - secret_epoch
    - X-Gitea-Delivery
  duplicate_same_key_same_digest: no_op
  duplicate_same_key_different_digest: security_incident_and_hook_quarantine
  accepted_action: durably_mark_mapped_resource_dirty_and_schedule_reconciliation
  canonical_mutation_from_payload: prohibited
  nats_on_request_path: false

reconciliation:
  serialization: ws03_optimistic_lease_and_generation
  postgresql_transaction_across_provider_io: prohibited
  outcomes:
    in_sync: persist_verified_snapshot_token
    accept: canonical_owner_port_then_projection_audit_and_outbox
    reset: durable_permit_per_provider_mutation_then_verify
    quarantine: fence_path_suppress_unsafe_projection_and_emit_safe_recovery_evidence
  direct_discovery_creates_canonical_resource_or_capability: false
  unknown_or_ambiguous_identity: quarantine
  general_project_creates_code_repository: false
  full_scan:
    default_interval_minutes: 15
    maximum_interval_minutes: 60
    checkpoint: last_trusted_job_cursor

provider_mutation:
  idempotency_key_reuse_same_input: return_existing_operation_or_result
  idempotency_key_reuse_different_input: non_disclosing_conflict
  network_io_inside_postgresql_transaction: false
  permit: one_use_per_excluded_effect_call
  ambiguous_result: reconciling_until_terminal_proof
  snapshot_or_elapsed_time_terminalizes_ambiguous_effect: false
  blind_retry: prohibited
  create_adoption_requires:
    - provider_enforced_operation_bound_immutable_uniqueness_key
    - exact_compatibility_profile_evidence
    - exactly_one_verified_candidate
  manual_recovery:
    fresh_authorization_and_audit: required
    fabricates_original_effect_proof: false
    may_attach_authenticated_no_effect_or_complete_fencing_evidence: true

compatibility_profile:
  key:
    - exact_gitea_version
    - api_or_schema_digest
  declares:
    - supported_interfaces_fields_and_enum_mappings
    - conditional_inputs_and_concurrency_tokens
    - pagination_and_visibility_horizon
    - transient_retry_classes_and_hints
    - per_operation_call_bounds
    - direct_change_proof_capabilities
    - safe_idempotent_reads
    - operation_bound_create_key_capability
  unknown_or_missing_required_capability: affected_mutations_unready
  support_matrix: current_plus_two_prior_minors_and_next_candidate_when_upstream_exists

privacy_and_observability:
  propagation_surfaces: [logical_audit, event, outbox, dlq, log, trace, metric, diagnostic, support_evidence]
  safe_value_rules:
    unknown_field: reject
    provider_derived_free_text: prohibited
    opaque_identifier_max_bytes: 128
    codes: closed_server_owned_enums
    counts: nonnegative_integers_within_scope_envelope
    digests: exactly_64_lowercase_hex_sha256
    timestamps: bounded_utc_rfc3339
    canonical_references: authorized_audit_or_partition_scope_only
    evidence_references: at_least_128_bits_csprng_opaque_non_content_derived_unique_per_logical_operation_and_authorized_resolution_only
  canonical_composition:
    activation: all_named_versioned_schemas_registered_validated_and_consumer_readable_before_first_emission
    rollback: stop_new_emission_preserve_old_and_new_readers_and_reconcile_forward_without_reinterpreting_committed_evidence
    logical_audit:
      predecessor_contract: specs/work-graph-profile/owgp-v0.1.schema.json#/$defs/AuditRecord
      predecessor_schema_version: '1.0'
      resource_envelope_successor_contract: packages/domain-schemas/common/resource-envelope/resource-envelope-v1.1.schema.json
      resource_envelope_successor_contract_id: https://stead.example/packages/domain-schemas/common/resource-envelope/resource-envelope-v1.1.schema.json
      emission_contract: packages/domain-schemas/resources/audit-record/audit-record-v1.1.schema.json
      emission_contract_id: https://stead.example/packages/domain-schemas/resources/audit-record/audit-record-v1.1.schema.json
      schema_version: '1.1'
      schema_owner: WS-01
      composition: resource_envelope_v1_1_plus_all_predecessor_audit_fields_plus_closed_optional_provider_evidence
      closure: unevaluated_properties_false_at_composed_record
      predecessor_compatibility: every_resource_envelope_and_audit_required_field_and_constraint_preserved_except_schema_version_advances_from_1_0_to_1_1
      provider_evidence_property: provider_reconciliation_evidence
      provider_evidence_contract: logical_audit_provider_evidence
      compatibility: preconsumer_minor_successor_with_v1_0_and_v1_1_dual_readers_consumer_first
    canonical_event:
      predecessor_data_contract: packages/event-schemas/stead/stead-event-v0.1.schema.json
      emission_data_contract: packages/event-schemas/stead/provider-reconciliation-event-v1.schema.json
      emission_data_contract_id: https://stead.example/packages/event-schemas/stead/provider-reconciliation-event-v1.schema.json
      schema_version: '1.0'
      schema_owner: WS-07
      predecessor_compatibility: every_stead_event_v0_1_required_field_and_constraint_preserved_except_schema_version_advances_from_0_1_to_1_0
      provider_evidence_property: provider_reconciliation_evidence
      provider_evidence_contract: canonical_event_provider_evidence
      envelope_common_attributes_contract: specs/asyncapi/stead.yaml#/components/schemas/SteadCloudEventAttributesV1
      envelope_contract: specs/asyncapi/stead.yaml#/components/schemas/ProviderReconciliationCloudEventEnvelope
      message_contract: specs/asyncapi/stead.yaml#/components/messages/ProviderReconciliationCloudEvent
      channel_binding: specs/asyncapi/stead.yaml#/channels/scmEvents/messages/ProviderReconciliationCloudEvent
      source: urn:stead:producer:scm
      type: stead.scm.reconciled.v1
      dataschema: https://stead.example/packages/event-schemas/stead/provider-reconciliation-event-v1.schema.json
      generic_v0_1_data_route_for_same_type: prohibited
      compatibility: registered_consumer_first_closed_specialization_preserves_all_common_event_fields
      protected_operation_lookup_reference: logical_operation_id_only_correlation_not_authority_or_provider_locator
    canonical_outbox:
      owner: WS-02
      representation: exact_serialized_bytes_and_digest_of_the_registered_canonical_event
      additional_provider_metadata_or_reserialization: prohibited
      terminal_transaction_participant: final_write_after_ws03_scm_terminalization
      audit_materialization_recovery: retain_until_ws07_exact_record_durable_or_obligation_atomically_transferred
    minimized_dead_letter_event:
      predecessor_data_contract: packages/event-schemas/stead/stead-event-v0.1.schema.json
      emission_data_contract: packages/event-schemas/stead/provider-reconciliation-dead-letter-v1.schema.json
      emission_data_contract_id: https://stead.example/packages/event-schemas/stead/provider-reconciliation-dead-letter-v1.schema.json
      schema_version: '1.0'
      schema_owner: WS-07
      predecessor_compatibility: every_stead_event_v0_1_required_field_and_constraint_preserved_except_schema_version_advances_from_0_1_to_1_0
      provider_evidence_property: provider_reconciliation_evidence
      provider_evidence_contract: dead_letter_provider_evidence
      envelope_common_attributes_contract: specs/asyncapi/stead.yaml#/components/schemas/SteadCloudEventAttributesV1
      envelope_contract: specs/asyncapi/stead.yaml#/components/schemas/ProviderReconciliationDeadLetterCloudEventEnvelope
      message_contract: specs/asyncapi/stead.yaml#/components/messages/ProviderReconciliationDeadLetterCloudEvent
      channel_binding: specs/asyncapi/stead.yaml#/channels/deadLetterEvents/messages/ProviderReconciliationDeadLetterCloudEvent
      source: urn:stead:producer:dead_letter
      type: stead.dead_letter.provider_reconciliation_recorded.v1
      dataschema: https://stead.example/packages/event-schemas/stead/provider-reconciliation-dead-letter-v1.schema.json
      generic_v0_1_data_route_for_same_type: prohibited
      compatibility: registered_consumer_first_closed_specialization_preserves_all_common_event_fields
      original_canonical_event_or_provider_payload_copy: prohibited
    asyncapi_envelope_refactor:
      common_attributes_component: SteadCloudEventAttributesV1
      standard_envelope_component: StandardSteadCloudEventEnvelope
      union_component: SteadCloudEventEnvelope
      specialized_components: [ProviderReconciliationCloudEventEnvelope, ProviderReconciliationDeadLetterCloudEventEnvelope]
      closure: each_standard_or_specialized_envelope_is_closed_after_common_attribute_and_data_composition
      discrimination: exact_source_type_and_dataschema_tuple
      standard_route_exclusion: both_provider_reconciliation_source_type_pairs_rejected_regardless_of_dataschema
      no_data_schema_fallback: a_provider_reconciliation_type_cannot_validate_with_stead_event_v0_1_data
  logical_audit_provider_evidence:
    closed_schema: true
    allowed_fields:
      - schema_version
      - logical_operation_id
      - decision_id
      - operation_class
      - outcome_code
      - authorization_scope_id
      - execution_claim_id
      - disclosure_mode
      - activation_revision
      - authorization_revision
      - provider_enforcement_revision
      - resource_revision
      - compatibility_profile_id
      - compatibility_profile_schema_digest
      - provider_binding_evidence_ref
      - call_plan_class
      - call_plan_evidence_ref
      - count_mode
      - attempt_count
      - provider_call_count
      - page_count
      - item_count
      - response_byte_count
      - started_at
      - finished_at
  canonical_event_provider_evidence:
    closed_schema: true
    required_fields: [schema_version, logical_operation_id]
    allowed_fields:
      - schema_version
      - logical_operation_id
    field_constraints:
      schema_version: {type: string, const: '1.0'}
      logical_operation_id: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$', min_length: 36, max_length: 36}
  dead_letter_provider_evidence:
    closed_schema: true
    allowed_fields:
      - schema_version
      - logical_operation_id
      - source_event_id
      - consumer_class_id
      - operation_class
      - terminal_failure_code
      - count_mode
      - attempt_count
      - deadline_at
  operational_surface_evidence:
    base_contract: docs/architecture/observability-contract.md
    provider_attribute_namespace: stead.provider_reconciliation
    profiles:
      correlated_operation_v1:
        closed_schema: true
