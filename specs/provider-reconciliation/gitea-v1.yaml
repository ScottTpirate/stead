schema_version: "1.0"
status: governed_by_adr_0009
owner: WS-03
decision_record: docs/adr/0009-gitea-provider-reconciliation-precedence-and-conflict-handling.md
activation_gate: ADR-CAND-008_ACCEPTED_AT_EXACT_IMMUTABLE_SHA
requirements:
  - PRIN-002
  - ARCH-004
  - DOM-004
  - SCM-001
  - SCM-002
  - SCM-003
  - SCM-004
  - SCM-005
  - AUTH-002
  - AUTH-006
  - CLS-003
  - CLS-006
  - CLS-007
  - SEC-006
  - EVT-003
  - AUD-001
  - AUD-002
  - TEST-006
  - PERF-003
  - PERF-004

authority:
  canonical_state: module_owned_postgresql
  provider_owned_state: gitea_documented_api_or_git
  provider_permission: enforcement_not_authority
  webhook: dirty_notification_not_canonical_delta
  ordinary_ui_read_source: local_rebuildable_postgresql_projection
  ordinary_ui_synchronous_provider_calls: 0

field_classes:
  canonical_only:
    examples: [organization_id, team_id, project_id, work_item_id, capabilities, team_hierarchy, typed_domain_relationships, agent_assignment, effective_label]
    disagreement: quarantine_attempted_representation_or_remap
  provider_content:
    examples: [work_title, work_body, comments, reactions, repository, branch, commit, pull_request]
    disagreement: accept_one_proven_authorized_delta_else_reset_or_quarantine
  mapped_value:
    examples: [work_type, priority, status, cycle_milestone, active_user_assignee]
    disagreement: accept_exact_existing_mapping_else_reset_or_quarantine
  managed_configuration:
    examples: [hidden_tracker, fixed_board, managed_labels, repository_purpose, webhook_registration]
    disagreement: reset_and_verify_else_quarantine
  central_security:
    examples: [authorization_relationship_tuples, permissions, security_domain, classification, handling, provider_path_eligibility]
    disagreement: fence_reset_verify_or_remain_denied_and_quarantined
  provider_identity:
    examples: [installation_id, repository_id, issue_id, comment_id, issue_number, git_sha, provider_creation_time]
    disagreement: map_only_to_authorized_resource_else_quarantine
  derived_projection:
    examples: [normalized_snapshot, search_input, activity_input, inbox_input, reconciliation_health]
    disagreement: rebuild_or_suppress_never_settle_authority

authorization_scope:
  type: ProviderAuthorizationScope
  owner: WS-06
  consumer: WS-03
  purpose: one_bounded_logical_internal_reconciliation_read_operation
  reusable: false
  renewable: false
  transferable: false
  eligible_calls:
    - pagination_read
    - snapshot_read
    - bounded_verification_read
    - compatibility_profile_safe_idempotent_read_retry
  excluded_effects_requiring_own_durable_one_use_permit:
    - provider_mutation
    - credential_issuance
    - direct_git_or_protocol_access
    - export_or_download
    - non_idempotent_call
    - ambiguous_external_effect
    - operation_outliving_logical_request_or_job
  required_bindings:
    - scope_id
    - logical_operation_id
    - acting_service_principal
    - initiating_principal_or_explicit_system_initiator
    - organization_id
    - security_domain_id
    - canonical_container
    - closed_resource_set_or_container_inventory_scope
    - provider_installation_id
    - provider_api_path
    - provider_resource_key_when_resource_specific
    - reconciliation_generation
    - allowed_operation_class
    - closed_call_plan
    - activation_snapshot
    - authorization_consistency_vector
    - compatibility_profile_id_version_and_schema_digest
    - original_deadline
    - immutable_earliest_bound_expiry
    - execution_claim_id
    - execution_holder_instance_id
    - execution_fencing_token
    - execution_claim_deadline
  call_plan_fixed_before_first_provider_call:
    - http_method_and_path_templates
    - resource_set_or_container_inventory_scope
    - cursor_derivation_rules
    - call_order
    - retry_classes
    - maximum_attempts
    - maximum_calls
    - maximum_pages
    - maximum_items
    - maximum_response_bytes
  execution_claim:
    owner: WS-03
    activation: atomic_issued_to_active_once_before_first_provider_call
    bound_fields: [execution_claim_id, execution_holder_instance_id, execution_fencing_token, execution_claim_deadline]
    holder_identity_source: process_start_bound_replica_boot_pid_start_and_random_nonce
    allowed_states: [issued, active, completed, abandoned, expired]
    dispatch_requires: active_exact_process_instance_holder_and_monotonic_fencing_token_before_claim_deadline
    same_holder_concurrency: process_local_single_flight_guard_on_non_shareable_instance_binding_required_before_validation
    fork_or_clone_behavior: inherited_binding_invalid_when_current_process_identity_differs_and_child_must_rekey_with_new_scope
    concurrent_or_forked_claim: denied_before_provider_io
    handoff_or_resume: prohibited
    same_scope_takeover: prohibited_new_scope_required
    terminal_transition: permanent_compare_and_swap_to_completed_abandoned_or_expired
    stale_holder_after_fence_or_terminal_transition: denied_before_provider_io
    per_eligible_call_or_page_claim_writes: 0
  inventory_list_behavior:
    observed_values: opaque_provider_resource_keys_within_bound_container_and_item_budget
    authority: inventory_drift_evidence_only
    prohibited:
      - widen_authority
      - authorize_canonical_acceptance
      - add_undeclared_resource_specific_followup
    followup_rule: predeclared_deterministic_container_rule_or_fresh_decision_and_scope
  before_each_provider_call:
    mode: read_only_validation
    checks:
      - exact_scope_and_logical_operation
      - principals_organization_domain_container_and_resources
      - installation_path_resource_key_generation_and_operation_class
      - call_plan_method_path_cursor_order_and_local_counters
      - active_execution_claim_current_process_instance_holder_fencing_token_state_and_deadline
      - activation_snapshot_and_authorization_consistency_vector
      - latest_provider_enforcement_and_resource_fences
      - compatibility_profile_deadline_and_expiry
  before_local_outcome_commit:
    mode: read_only_validation_plus_owner_transaction_fence
    checks:
      - all_before_call_checks
      - final_execution_local_totals_within_whole_plan_envelope
      - active_execution_claim_current_process_instance_holder_fencing_token_state_and_deadline
      - no_newer_dirty_generation
      - canonical_owner_revision
  persistence:
    start_transaction:
      - immutable_scope_identity_and_bindings
      - conservative_whole_plan_envelope
      - atomic_one_time_execution_claim_activation
      - logical_audit_start
    per_eligible_read_writes: 0
    per_eligible_page_writes: 0
    accounting_during_execution: process_local_monotonic_counters
    uncertain_dispatch: consumes_local_attempt_and_allowance
    clean_completion: one_logical_audit_with_exact_attempt_call_page_item_byte_counts
    interrupted_completion: one_logical_audit_with_reserved_upper_bounds_and_abandoned_or_crash_result
    page_count_growth: constant_postgresql_write_count
  process_loss:
    old_scope: permanently_abandoned_or_expired_by_fenced_compare_and_swap
    remaining_envelope: conservatively_consumed
    stale_holder_or_fork: denied_before_provider_io_by_process_instance_claim_state_fencing_token_and_deadline
    restart: only_after_old_claim_terminalization_then_fresh_central_decision_and_new_scope_from_last_trusted_job_cursor
  canonical_acceptance:
    service_read_scope_authorizes_acceptance: false
    required_before_accept:
      - fresh_effective_principal_central_decision_for_exact_delta
      - current_impersonation_constraints
      - final_activation_authorization_provider_enforcement_resource_and_operation_fences
      - optimistic_canonical_owner_precondition

snapshot_and_change_proof:
  snapshot_token_fields:
    - compatibility_profile_id
    - provider_resource_key
    - strongest_endpoint_specific_precondition_when_available
    - canonical_normalized_snapshot_sha256
    - informational_provider_timestamps
  timestamps_form_total_order: false
  direct_change_acceptance_requires:
    - supported_field_class
    - provider_authenticated_effective_actor_and_impersonator_chain
    - contiguous_predecessor_delta_result_proof
    - exactly_one_normalized_delta
    - current_effective_principal_authorization
    - final_owner_transaction_fence
  invalid_proofs:
    - webhook_sender_only
    - hmac_only
    - delivery_uuid_only
    - optional_or_partial_changes
    - token_gap
    - mixed_actor_snapshot
    - provider_local_permission

webhook:
  method: POST
  content_type: application/json
  signature:
    header: X-Gitea-Signature
    algorithm: HMAC-SHA256
    encoding: exactly_64_lowercase_hex_without_prefix
    compare: constant_time_before_json_parse
  limits:
    raw_body_bytes_max: 4194304
    json_nesting_depth_max: 32
  attempt_key:
    - installation_id
    - hook_registration_id
    - secret_epoch
    - X-Gitea-Delivery
  duplicate_same_key_same_digest: no_op
  duplicate_same_key_different_digest: security_incident_and_hook_quarantine
  accepted_action: durably_mark_mapped_resource_dirty_and_schedule_reconciliation
  canonical_mutation_from_payload: prohibited
  nats_on_request_path: false

reconciliation:
  serialization: ws03_optimistic_lease_and_generation
  postgresql_transaction_across_provider_io: prohibited
  outcomes:
    in_sync: persist_verified_snapshot_token
    accept: canonical_owner_port_then_projection_audit_and_outbox
    reset: durable_permit_per_provider_mutation_then_verify
    quarantine: fence_path_suppress_unsafe_projection_and_emit_safe_recovery_evidence
  direct_discovery_creates_canonical_resource_or_capability: false
  unknown_or_ambiguous_identity: quarantine
  general_project_creates_code_repository: false
  full_scan:
    default_interval_minutes: 15
    maximum_interval_minutes: 60
    checkpoint: last_trusted_job_cursor

provider_mutation:
  idempotency_key_reuse_same_input: return_existing_operation_or_result
  idempotency_key_reuse_different_input: non_disclosing_conflict
  network_io_inside_postgresql_transaction: false
  permit: one_use_per_excluded_effect_call
  ambiguous_result: reconciling_until_terminal_proof
  snapshot_or_elapsed_time_terminalizes_ambiguous_effect: false
  blind_retry: prohibited
  create_adoption_requires:
    - provider_enforced_operation_bound_immutable_uniqueness_key
    - exact_compatibility_profile_evidence
    - exactly_one_verified_candidate
  manual_recovery:
    fresh_authorization_and_audit: required
    fabricates_original_effect_proof: false
    may_attach_authenticated_no_effect_or_complete_fencing_evidence: true

compatibility_profile:
  key:
    - exact_gitea_version
    - api_or_schema_digest
  declares:
    - supported_interfaces_fields_and_enum_mappings
    - conditional_inputs_and_concurrency_tokens
    - pagination_and_visibility_horizon
    - transient_retry_classes_and_hints
    - per_operation_call_bounds
    - direct_change_proof_capabilities
    - safe_idempotent_reads
    - operation_bound_create_key_capability
  unknown_or_missing_required_capability: affected_mutations_unready
  support_matrix: current_plus_two_prior_minors_and_next_candidate_when_upstream_exists

privacy_and_observability:
  propagation_surfaces: [logical_audit, event, outbox, dlq, log, trace, metric, diagnostic, support_evidence]
  safe_value_rules:
    unknown_field: reject
    provider_derived_free_text: prohibited
    opaque_identifier_max_bytes: 128
    codes: closed_server_owned_enums
    counts: nonnegative_integers_within_scope_envelope
    digests: exactly_64_lowercase_hex_sha256
    timestamps: bounded_utc_rfc3339
    canonical_references: authorized_audit_or_partition_scope_only
    evidence_references: at_least_128_bits_csprng_opaque_non_content_derived_unique_per_logical_operation_and_authorized_resolution_only
  logical_operation_audit:
    closed_schema: true
    allowed_fields:
      - schema_version
      - logical_operation_id
      - decision_id
      - acting_service_principal_ref
      - initiating_principal_ref_when_relevant
      - canonical_containing_scope_ref
      - security_domain_id
      - operation_class
      - outcome_code
      - authorization_scope_id
      - execution_claim_id
      - activation_revision
      - authorization_revision
      - provider_enforcement_revision
      - resource_revision
      - compatibility_profile_id
      - compatibility_profile_schema_digest
      - provider_binding_evidence_ref
      - call_plan_class
      - call_plan_evidence_ref
      - count_mode
      - attempt_count
      - provider_call_count
      - page_count
      - item_count
      - response_byte_count
      - correlation_id
      - causation_id
      - started_at
      - finished_at
  provider_reconciliation_event_outbox_dlq_payload:
    closed_schema: true
    allowed_fields:
      - schema_version
      - event_type
      - event_id
      - occurred_at
      - organization_id
      - security_domain_id
      - canonical_container_ref
      - logical_operation_id
      - operation_class
      - outcome_code
      - compatibility_profile_id
      - count_mode
      - attempt_count
      - provider_call_count
      - page_count
      - item_count
      - response_byte_count
      - correlation_id
      - causation_id
  audit_representation:
    provider_binding: opaque_random_reference_to_ws03_protected_operation_record
    bounded_call_plan: closed_class_plus_opaque_random_reference_to_ws03_protected_operation_record
    compatibility_profile: id_and_schema_digest_only
  logical_audit_semantics:
    - acting_service_principal
    - initiating_and_effective_principal_when_relevant
    - safe_canonical_containing_scope
    - source_class_and_outcome
    - authorization_model_policy_and_provider_enforcement_revisions
    - scope_operation_and_permit_references
    - bounded_counts_opaque_plan_and_provider_references_and_safe_profile_reference
    - exact_or_conservative_execution_counts
    - correlation_and_causation
  forbidden_from_all_propagation_surfaces:
    - raw_provider_bodies
    - parsed_provider_bodies
    - request_or_response_headers
    - request_query_strings
    - raw_bounded_call_plans
    - provider_api_paths
    - provider_resource_keys_or_locators
    - pagination_cursors
    - webhook_secrets
    - webhook_signatures
    - credentials
    - protected_content
    - work_titles
    - comments
    - document_bodies
    - authorization_inputs
    - policy_inputs
    - exception_text
    - stack_traces
  performance_evidence:
    - endpoint_or_scenario
    - p50_p95_p99
    - sql_queries
    - postgresql_writes
    - openfga_calls
    - provider_calls
    - response_size
    - frontend_chunk_delta
    - baseline_comparison

verification:
  T-ADR-0009-PRECEDENCE:
    owners: [WS-03]
    cases: [all_field_classes, unknown_class, multiple_classes, ontology_creation, canonical_id_remap, capability_creation]
  T-ADR-0009-WEBHOOK-IDEMPOTENCY:
    owners: [WS-03, WS-07]
    cases: [valid_hmac, malformed_hmac, body_and_depth_bounds, duplicate_attempt, attempt_digest_collision, redelivery, out_of_order, missed_event, restart, payload_not_authority]
  T-ADR-0009-DIRECT-CHANGE-ACCEPT:
    owners: [WS-03, WS-02, WS-06]
    cases: [contiguous_single_delta, exact_actor_and_impersonator, current_authorization, token_gap, mixed_actor, revoked_or_historical_authority]
  T-ADR-0009-DIRECT-CHANGE-RESET:
    owners: [WS-03, WS-06]
    cases: [managed_configuration, invalid_mapped_value, idempotent_reset, exact_verification, no_ontology_creation]
  T-ADR-0009-CONFLICT-QUARANTINE:
    owners: [WS-03, WS-06]
    cases: [concurrent_edits, unknown_actor_or_field, mapping_collision, delete_or_rename, failed_repair, ambiguous_create, no_existence_leak]
  T-ADR-0009-PERMISSION-DRIFT:
    owners: [WS-03, WS-06]
    cases: [api, git_ssh, git_https, lfs, token, package, artifact, runner, webhook, raw_admin]
  T-ADR-0009-PROVIDER-OUTAGE:
    owners: [WS-03, WS-12]
    cases: [safe_local_read, pending_field_denial, provider_effect_denial, cursor_recovery, no_fabricated_empty_state, no_canonical_delete]
  T-ADR-0009-AMBIGUOUS-MUTATION:
    owners: [WS-03, WS-06]
    cases: [lost_update_response, lost_delete_response, lost_create_response, apply_revert, delete_recreate, delayed_create, zero_one_many_candidates, excluded_effect_permits, no_blind_retry, no_false_terminal_state]
  T-ADR-0009-FULL-RECONCILIATION:
    owners: [WS-03, WS-06, WS-12]
    cases: [every_scope_binding_omitted_or_swapped, call_plan_widen_or_reorder, cross_scope_reuse, atomic_one_time_execution_claim, same_scope_fork, stale_holder, post_terminal_replay, claim_deadline, permanent_terminal_invalidation, process_loss, bounded_inventory, zero_per_page_writes, exact_or_conservative_audit_counts, constant_writes_as_pages_grow]
  T-ADR-0009-AUDIT-MINIMIZATION:
    owners: [WS-03, WS-07]
    cases: [closed_logical_audit_fields, closed_event_outbox_dlq_fields, provider_binding_opaque_reference_only, call_plan_opaque_reference_only, low_entropy_offline_guessing_denied, cross_event_provider_plan_reference_correlation_denied, raw_body_canary, parsed_body_canary, request_header_canary, query_string_canary, raw_call_plan_canary, provider_api_path_canary, provider_resource_key_canary, pagination_cursor_canary, webhook_secret_canary, webhook_signature_canary, credential_canary, protected_content_canary, work_title_canary, comment_canary, document_body_canary, authorization_input_canary, policy_input_canary, exception_text_canary, stack_trace_canary, every_canary_across_every_propagation_surface]
  T-ADR-0009-UPGRADE-ROLLBACK:
    owners: [WS-03, WS-12]
    cases: [support_matrix, unknown_capability, preflight, shadow_read, full_scan, compatible_rollback, forward_recovery, nonterminal_operation_preservation]
