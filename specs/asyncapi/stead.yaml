      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: {const: '1.0'}
        id: {type: string}
        source:
          type: string
          format: uri
          pattern: '^urn:stead:producer:(organization|identity|authorization|classification|project|workitem|comment|document|scm|ci|artifact|attachment|storage|search_graph|notification|audit|migration|operations|dead_letter)$'
        type: {type: string, pattern: '^stead\.[a-z0-9_]+\.[a-z0-9_]+\.v[1-9][0-9]*$'}
        subject: {type: string}
        time: {type: string, format: date-time}
        datacontenttype: {const: application/json}
        dataschema: {type: string, format: uri}
        data: {$ref: '../../packages/event-schemas/stead/stead-event-v0.1.schema.json'}
      additionalProperties: false
    OrganizationCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SteadCloudEventEnvelope'}
