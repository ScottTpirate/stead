asyncapi: 3.1.0
info:
  title: Stead Platform Events
  version: 0.1.0
  description: CloudEvents 1.0 subjects for authoritative changes, controlled lifecycle events, and rebuildable projections.
defaultContentType: application/cloudevents+json
servers:
  nats:
    host: nats:4222
    protocol: nats
channels:
  organizationEvents:
    address: platform.organization.changed.v1
    x-event-types: [platform.organization.created.v1, platform.organization.updated.v1, platform.team.created.v1, platform.team.updated.v1, platform.team.reparented.v1, platform.team.membership_changed.v1]
    messages: {OrganizationCloudEvent: {$ref: '#/components/messages/OrganizationCloudEvent'}}
  identityEvents:
    address: platform.identity.changed.v1
    x-event-types: [platform.identity.provisioned.v1, platform.identity.updated.v1, platform.identity.suspended.v1, platform.agent.registered.v1, platform.agent.revoked.v1]
    messages: {IdentityCloudEvent: {$ref: '#/components/messages/IdentityCloudEvent'}}
  authorizationEvents:
    address: platform.authorization.changed.v1
    x-event-types: [platform.authorization.model_activated.v1, platform.authorization.tuple_changed.v1, platform.authorization.delegation_revoked.v1, platform.authorization.policy_activated.v1]
    messages: {AuthorizationCloudEvent: {$ref: '#/components/messages/AuthorizationCloudEvent'}}
  classificationEvents:
    address: platform.classification.changed.v1
    x-event-types: [platform.classification.label_raised.v1, platform.classification.label_lowered.v1, platform.classification.profile_activated.v1, platform.classification.ceiling_changed.v1, platform.classification.attribute_changed.v1]
    messages: {ClassificationCloudEvent: {$ref: '#/components/messages/ClassificationCloudEvent'}}
  projectEvents:
    address: platform.project.changed.v1
    x-event-types: [platform.project.created.v1, platform.project.updated.v1, platform.project.capability_changed.v1, platform.initiative.changed.v1, platform.cycle.changed.v1]
    messages: {ProjectCloudEvent: {$ref: '#/components/messages/ProjectCloudEvent'}}
  workEvents:
    address: platform.workitem.changed.v1
    x-event-types: [platform.workitem.created.v1, platform.workitem.updated.v1, platform.workitem.assigned.v1, platform.workitem.related.v1]
    messages: {WorkCloudEvent: {$ref: '#/components/messages/WorkCloudEvent'}}
  commentEvents:
    address: platform.comment.changed.v1
    x-event-types: [platform.comment.created.v1, platform.comment.updated.v1, platform.comment.deleted.v1]
    messages: {CommentCloudEvent: {$ref: '#/components/messages/CommentCloudEvent'}}
  knowledgeEvents:
    address: platform.document.changed.v1
    x-event-types: [platform.document.created.v1, platform.document.updated.v1, platform.document.review_requested.v1, platform.document.approved.v1, platform.document.superseded.v1]
    messages: {KnowledgeCloudEvent: {$ref: '#/components/messages/KnowledgeCloudEvent'}}
  scmEvents:
    address: platform.scm.changed.v1
    x-event-types: [platform.scm.repository_changed.v1, platform.scm.branch_changed.v1, platform.scm.commit_recorded.v1, platform.scm.pull_request_changed.v1, platform.scm.reconciled.v1]
    messages: {ScmCloudEvent: {$ref: '#/components/messages/ScmCloudEvent'}}
  ciEvents:
    address: platform.ci.changed.v1
    x-event-types: [platform.ci.build_changed.v1, platform.ci.deployment_changed.v1, platform.ci.runner_changed.v1, platform.ci.action_changed.v1]
    messages: {CiCloudEvent: {$ref: '#/components/messages/CiCloudEvent'}}
  artifactEvents:
    address: platform.artifact.changed.v1
    x-event-types: [platform.artifact.artifact_changed.v1, platform.artifact.package_changed.v1, platform.artifact.release_changed.v1]
    messages: {ArtifactCloudEvent: {$ref: '#/components/messages/ArtifactCloudEvent'}}
  attachmentEvents:
    address: platform.attachment.changed.v1
    x-event-types: [platform.attachment.created.v1, platform.attachment.scanned.v1, platform.attachment.deleted.v1]
    messages: {AttachmentCloudEvent: {$ref: '#/components/messages/AttachmentCloudEvent'}}
  storageEvents:
    address: platform.storage.changed.v1
    x-event-types: [platform.storage.scan_changed.v1, platform.storage.retention_changed.v1, platform.storage.provider_operation_changed.v1]
    messages: {StorageCloudEvent: {$ref: '#/components/messages/StorageCloudEvent'}}
  searchGraphEvents:
    address: platform.search_graph.changed.v1
    x-event-types: [platform.search_graph.rebuild_started.v1, platform.search_graph.rebuild_completed.v1, platform.search_graph.rebuild_failed.v1]
    messages: {SearchGraphCloudEvent: {$ref: '#/components/messages/SearchGraphCloudEvent'}}
  notificationEvents:
    address: platform.notification.changed.v1
    x-event-types: [platform.notification.created.v1, platform.notification.read.v1, platform.notification.delivery_changed.v1, platform.notification.suppressed.v1]
    messages: {NotificationCloudEvent: {$ref: '#/components/messages/NotificationCloudEvent'}}
  auditEvents:
    address: platform.audit.changed.v1
    x-event-types: [platform.audit.checkpoint_created.v1, platform.audit.export_changed.v1]
    messages: {AuditCloudEvent: {$ref: '#/components/messages/AuditCloudEvent'}}
  migrationEvents:
    address: platform.migration.changed.v1
    x-event-types: [platform.migration.stage_changed.v1, platform.migration.reconciled.v1, platform.migration.cutover_changed.v1]
    messages: {MigrationCloudEvent: {$ref: '#/components/messages/MigrationCloudEvent'}}
  operationsEvents:
    address: platform.operations.changed.v1
    x-event-types: [platform.operations.install_changed.v1, platform.operations.upgrade_changed.v1, platform.operations.backup_changed.v1, platform.operations.restore_changed.v1, platform.operations.doctor_changed.v1]
    messages: {OperationsCloudEvent: {$ref: '#/components/messages/OperationsCloudEvent'}}
  deadLetterEvents:
    address: platform.dead_letter.recorded.v1
    x-event-types: [platform.dead_letter.recorded.v1, platform.dead_letter.replayed.v1]
    messages: {DeadLetterCloudEvent: {$ref: '#/components/messages/DeadLetterCloudEvent'}}
operations:
  sendOrganizationEvents: {action: send, channel: {$ref: '#/channels/organizationEvents'}}
  receiveOrganizationEvents: {action: receive, channel: {$ref: '#/channels/organizationEvents'}}
  sendIdentityEvents: {action: send, channel: {$ref: '#/channels/identityEvents'}}
  receiveIdentityEvents: {action: receive, channel: {$ref: '#/channels/identityEvents'}}
  sendAuthorizationEvents: {action: send, channel: {$ref: '#/channels/authorizationEvents'}}
  receiveAuthorizationEvents: {action: receive, channel: {$ref: '#/channels/authorizationEvents'}}
  sendClassificationEvents: {action: send, channel: {$ref: '#/channels/classificationEvents'}}
  receiveClassificationEvents: {action: receive, channel: {$ref: '#/channels/classificationEvents'}}
  sendProjectEvents: {action: send, channel: {$ref: '#/channels/projectEvents'}}
  receiveProjectEvents: {action: receive, channel: {$ref: '#/channels/projectEvents'}}
  sendWorkEvents: {action: send, channel: {$ref: '#/channels/workEvents'}}
  receiveWorkEvents: {action: receive, channel: {$ref: '#/channels/workEvents'}}
  sendCommentEvents: {action: send, channel: {$ref: '#/channels/commentEvents'}}
  receiveCommentEvents: {action: receive, channel: {$ref: '#/channels/commentEvents'}}
  sendKnowledgeEvents: {action: send, channel: {$ref: '#/channels/knowledgeEvents'}}
  receiveKnowledgeEvents: {action: receive, channel: {$ref: '#/channels/knowledgeEvents'}}
  sendScmEvents: {action: send, channel: {$ref: '#/channels/scmEvents'}}
  receiveScmEvents: {action: receive, channel: {$ref: '#/channels/scmEvents'}}
  sendCiEvents: {action: send, channel: {$ref: '#/channels/ciEvents'}}
  receiveCiEvents: {action: receive, channel: {$ref: '#/channels/ciEvents'}}
  sendArtifactEvents: {action: send, channel: {$ref: '#/channels/artifactEvents'}}
  receiveArtifactEvents: {action: receive, channel: {$ref: '#/channels/artifactEvents'}}
  sendAttachmentEvents: {action: send, channel: {$ref: '#/channels/attachmentEvents'}}
  receiveAttachmentEvents: {action: receive, channel: {$ref: '#/channels/attachmentEvents'}}
  sendStorageEvents: {action: send, channel: {$ref: '#/channels/storageEvents'}}
  receiveStorageEvents: {action: receive, channel: {$ref: '#/channels/storageEvents'}}
  sendSearchGraphEvents: {action: send, channel: {$ref: '#/channels/searchGraphEvents'}}
  receiveSearchGraphEvents: {action: receive, channel: {$ref: '#/channels/searchGraphEvents'}}
  sendNotificationEvents: {action: send, channel: {$ref: '#/channels/notificationEvents'}}
  receiveNotificationEvents: {action: receive, channel: {$ref: '#/channels/notificationEvents'}}
  sendAuditEvents: {action: send, channel: {$ref: '#/channels/auditEvents'}}
  receiveAuditEvents: {action: receive, channel: {$ref: '#/channels/auditEvents'}}
  sendMigrationEvents: {action: send, channel: {$ref: '#/channels/migrationEvents'}}
  receiveMigrationEvents: {action: receive, channel: {$ref: '#/channels/migrationEvents'}}
  sendOperationsEvents: {action: send, channel: {$ref: '#/channels/operationsEvents'}}
  receiveOperationsEvents: {action: receive, channel: {$ref: '#/channels/operationsEvents'}}
  sendDeadLetterEvents: {action: send, channel: {$ref: '#/channels/deadLetterEvents'}}
  receiveDeadLetterEvents: {action: receive, channel: {$ref: '#/channels/deadLetterEvents'}}
components:
  messages:
    OrganizationCloudEvent:
      name: OrganizationCloudEvent
      title: Organization and Team event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/OrganizationCloudEventEnvelope'}
    IdentityCloudEvent:
      name: IdentityCloudEvent
      title: Principal lifecycle event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/IdentityCloudEventEnvelope'}
    AuthorizationCloudEvent:
      name: AuthorizationCloudEvent
      title: Authorization control-plane event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/AuthorizationCloudEventEnvelope'}
    ClassificationCloudEvent:
      name: ClassificationCloudEvent
      title: Classification control-plane event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/ClassificationCloudEventEnvelope'}
    ProjectCloudEvent:
      name: ProjectCloudEvent
      title: Project planning event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/ProjectCloudEventEnvelope'}
    WorkCloudEvent:
      name: WorkCloudEvent
      title: Work Item event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/WorkCloudEventEnvelope'}
    CommentCloudEvent:
      name: CommentCloudEvent
      title: Comment event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/CommentCloudEventEnvelope'}
    KnowledgeCloudEvent:
      name: KnowledgeCloudEvent
      title: Document lifecycle event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/KnowledgeCloudEventEnvelope'}
    ScmCloudEvent:
      name: ScmCloudEvent
      title: Source-control event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/ScmCloudEventEnvelope'}
    CiCloudEvent:
      name: CiCloudEvent
      title: Continuous-integration and deployment event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/CiCloudEventEnvelope'}
    ArtifactCloudEvent:
      name: ArtifactCloudEvent
      title: Artifact, package, and release event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/ArtifactCloudEventEnvelope'}
    AttachmentCloudEvent:
      name: AttachmentCloudEvent
      title: Attachment event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/AttachmentCloudEventEnvelope'}
    StorageCloudEvent:
      name: StorageCloudEvent
      title: Storage control-plane event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/StorageCloudEventEnvelope'}
    SearchGraphCloudEvent:
      name: SearchGraphCloudEvent
      title: Search and graph projection event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/SearchGraphCloudEventEnvelope'}
    NotificationCloudEvent:
      name: NotificationCloudEvent
      title: Notification event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/NotificationCloudEventEnvelope'}
    AuditCloudEvent:
      name: AuditCloudEvent
      title: Audit lifecycle event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/AuditCloudEventEnvelope'}
    MigrationCloudEvent:
      name: MigrationCloudEvent
      title: Migration lifecycle event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/MigrationCloudEventEnvelope'}
    OperationsCloudEvent:
      name: OperationsCloudEvent
      title: Platform operations event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/OperationsCloudEventEnvelope'}
    DeadLetterCloudEvent:
      name: DeadLetterCloudEvent
      title: Dead-letter lifecycle event
      correlationId: {location: '$message.payload#/data/actor_context/correlation_id'}
      payload: {$ref: '#/components/schemas/DeadLetterCloudEventEnvelope'}
  schemas:
    PlatformCloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: {const: '1.0'}
        id: {type: string}
        source: {type: string, format: uri-reference}
        type: {type: string, pattern: '^platform\.[a-z0-9_]+\.[a-z0-9_]+\.v1$'}
        subject: {type: string}
        time: {type: string, format: date-time}
        datacontenttype: {const: application/json}
        dataschema: {type: string, format: uri}
        data: {$ref: '../../packages/event-schemas/platform/platform-event.schema.json'}
      additionalProperties: false
    OrganizationCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.organization.created.v1, platform.organization.updated.v1, platform.team.created.v1, platform.team.updated.v1, platform.team.reparented.v1, platform.team.membership_changed.v1]}}}
    IdentityCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.identity.provisioned.v1, platform.identity.updated.v1, platform.identity.suspended.v1, platform.agent.registered.v1, platform.agent.revoked.v1]}}}
    AuthorizationCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.authorization.model_activated.v1, platform.authorization.tuple_changed.v1, platform.authorization.delegation_revoked.v1, platform.authorization.policy_activated.v1]}}}
    ClassificationCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.classification.label_raised.v1, platform.classification.label_lowered.v1, platform.classification.profile_activated.v1, platform.classification.ceiling_changed.v1, platform.classification.attribute_changed.v1]}}}
    ProjectCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.project.created.v1, platform.project.updated.v1, platform.project.capability_changed.v1, platform.initiative.changed.v1, platform.cycle.changed.v1]}}}
    WorkCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.workitem.created.v1, platform.workitem.updated.v1, platform.workitem.assigned.v1, platform.workitem.related.v1]}}}
    CommentCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.comment.created.v1, platform.comment.updated.v1, platform.comment.deleted.v1]}}}
    KnowledgeCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.document.created.v1, platform.document.updated.v1, platform.document.review_requested.v1, platform.document.approved.v1, platform.document.superseded.v1]}}}
    ScmCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.scm.repository_changed.v1, platform.scm.branch_changed.v1, platform.scm.commit_recorded.v1, platform.scm.pull_request_changed.v1, platform.scm.reconciled.v1]}}}
    CiCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.ci.build_changed.v1, platform.ci.deployment_changed.v1, platform.ci.runner_changed.v1, platform.ci.action_changed.v1]}}}
    ArtifactCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.artifact.artifact_changed.v1, platform.artifact.package_changed.v1, platform.artifact.release_changed.v1]}}}
    AttachmentCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.attachment.created.v1, platform.attachment.scanned.v1, platform.attachment.deleted.v1]}}}
    StorageCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.storage.scan_changed.v1, platform.storage.retention_changed.v1, platform.storage.provider_operation_changed.v1]}}}
    SearchGraphCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.search_graph.rebuild_started.v1, platform.search_graph.rebuild_completed.v1, platform.search_graph.rebuild_failed.v1]}}}
    NotificationCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.notification.created.v1, platform.notification.read.v1, platform.notification.delivery_changed.v1, platform.notification.suppressed.v1]}}}
    AuditCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.audit.checkpoint_created.v1, platform.audit.export_changed.v1]}}}
    MigrationCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.migration.stage_changed.v1, platform.migration.reconciled.v1, platform.migration.cutover_changed.v1]}}}
    OperationsCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.operations.install_changed.v1, platform.operations.upgrade_changed.v1, platform.operations.backup_changed.v1, platform.operations.restore_changed.v1, platform.operations.doctor_changed.v1]}}}
    DeadLetterCloudEventEnvelope:
      allOf:
        - {$ref: '#/components/schemas/PlatformCloudEventEnvelope'}
        - {type: object, properties: {type: {enum: [platform.dead_letter.recorded.v1, platform.dead_letter.replayed.v1]}}}
x-delivery-contract:
  delivery: at-least-once
  producer: transactional-outbox
  consumer: idempotent
  ordering: per-resource-only
  replay: authorized-and-audited
  dlq: required
  protected-body-payloads: prohibited
