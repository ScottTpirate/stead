name: Stead foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  ASYNCAPI_DISABLE_TELEMETRY: "true"
  DO_NOT_TRACK: "1"
  GOTOOLCHAIN: local
  NEXT_TELEMETRY_DISABLED: "1"
  NO_COLOR: "1"
  NO_UPDATE_NOTIFIER: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  OTEL_SDK_DISABLED: "true"
  REDOCLY_TELEMETRY: "off"

jobs:
  foundation:
    name: Foundation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the candidate without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          show-progress: false

      - name: Verify the host Ruby compatibility floor
        run: ruby -e 'abort "Ruby 3.2 or newer is required" if Gem::Version.new(RUBY_VERSION) < Gem::Version.new("3.2.0")'

      - name: Install the exact npm lock without lifecycle scripts
        run: scripts/run_pinned_node.sh npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the complete foundation gate
        run: make foundation-check
