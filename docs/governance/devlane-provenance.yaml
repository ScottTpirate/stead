update:
  trigger: a proposed source commit, tree, license blob, import scope, or distribution change
  procedure: >-
    Create a new dependency candidate, verify the immutable commit and tree directly from
    upstream, compare license and notice obligations, review source and transitive changes,
    rerun frontend, contract, accessibility, security, and notice checks, then obtain
    independent approval before import or merge.
  floating_refs_prohibited: true
rollback:
  current_state: >-
    No source is imported, so rollback is removal of the unused candidate reference only.
  after_import: >-
    Restore the last independently approved import ledger and Stead revision; remove files
    introduced only by the rejected update; rebuild from locked inputs; rerun provenance,
    notice, security, accessibility, contract, and product-ontology checks. Preserve MIT
    notices for any Devlane-derived material that remains distributed.
